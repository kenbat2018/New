name: inspect-lob-files
on:
  push:
    paths:
      - ".github/workflows/inspect-lob-files.yml"
      - "inspect_lob_files.py"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q huggingface_hub
      - run: python inspect_lob_files.py
